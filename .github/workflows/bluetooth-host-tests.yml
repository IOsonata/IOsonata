name: Bluetooth host tests

on:
  push:
    branches:
      # Every Bluetooth working branch is named bt_*, so match the pattern
      # rather than listing them. Naming them one at a time meant a new branch
      # was silently outside CI until someone noticed: bt_feat_5_4 ran none of
      # these jobs on any push for the whole of its life.
      - "bt_*"
    paths:
      - "include/bluetooth/**"
      - "src/bluetooth/**"
      - "tests/bluetooth/**"
      - "include/app_evt_handler.h"
      - "src/app_evt_handler.cpp"
      - "include/cfifo.h"
      - "src/cfifo.c"
      - "ARM/Nordic/nRF52/src/bt_*"
      - "ARM/Nordic/nRF54/src/bt_*"
      - "ARM/Nordic/nRF54/src/peer_data_storage.c"
      - "ARM/Nordic/src/bt_*"
      - "ARM/ST/STM32WBAxx/src/bt_*"
      - "exemples/bluetooth/**"
      - ".github/workflows/bluetooth-host-tests.yml"
  pull_request:
    paths:
      - "include/bluetooth/**"
      - "src/bluetooth/**"
      - "tests/bluetooth/**"
      - "include/app_evt_handler.h"
      - "src/app_evt_handler.cpp"
      - "include/cfifo.h"
      - "src/cfifo.c"
      - "ARM/Nordic/nRF52/src/bt_*"
      - "ARM/Nordic/nRF54/src/bt_*"
      - "ARM/Nordic/nRF54/src/peer_data_storage.c"
      - "ARM/Nordic/src/bt_*"
      - "ARM/ST/STM32WBAxx/src/bt_*"
      - "exemples/bluetooth/**"
      - ".github/workflows/bluetooth-host-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - cc: gcc
            cxx: g++
            opt: -O0
          - cc: gcc
            cxx: g++
            opt: -O2
          - cc: clang
            cxx: clang++
            opt: -O0
          - cc: clang
            cxx: clang++
            opt: -O2

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and run Bluetooth host tests
        run: |
          make -C tests/bluetooth/host clean test \
            CC=${{ matrix.cc }} \
            CXX=${{ matrix.cxx }} \
            OPT=${{ matrix.opt }}

      - name: Build and run Bluetooth compliance tests
        run: |
          make -C tests/bluetooth/compliance clean test \
            CC=${{ matrix.cc }} \
            CXX=${{ matrix.cxx }} \
            OPT=${{ matrix.opt }}
