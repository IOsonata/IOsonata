name: Bluetooth host tests

on:
  push:
    branches:
      - bt_update
      - bt_conformance
    paths:
      - "include/bluetooth/**"
      - "src/bluetooth/**"
      - "tests/bluetooth/**"
      - ".github/workflows/bluetooth-host-tests.yml"
  pull_request:
    paths:
      - "include/bluetooth/**"
      - "src/bluetooth/**"
      - "tests/bluetooth/**"
      - ".github/workflows/bluetooth-host-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-unit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and run Bluetooth host tests
        run: |
          make -C tests/bluetooth/host clean test \
            CC=gcc \
            CXX=g++ \
            OPT=-O0

      - name: Build and run Bluetooth compliance tests
        run: |
          make -C tests/bluetooth/compliance clean test \
            CC=gcc \
            CXX=g++ \
            OPT=-O0
