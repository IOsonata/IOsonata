name: 0.13 SAM4L crypto focused regression

on:
  push:
    branches:
      - release_0_13_final_prep
    paths:
      - 'ARM/Microchip/SAM4L/**'
      - 'ARM/Microchip/src/crypto_sam.cpp'
      - 'tests/crypto/run_sam_models.py'
      - 'tests/crypto/sam_model*'
      - '.github/workflows/release-0_13-sam4l-crypto.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sam4l-crypto:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: SAM4E SAM4LC SAM4LS register-model crypto tests O0 and O2
        run: timeout --signal=TERM --kill-after=10s 900s python3 -u tests/crypto/run_sam_models.py
