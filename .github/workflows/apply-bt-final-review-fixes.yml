name: Validate SMP transmission barrier

on:
  push:
    branches:
      - bt-failure-fix-run
    paths:
      - "tools/apply_bt_smp_tx_barrier.py"
      - ".github/workflows/apply-bt-final-review-fixes.yml"
  pull_request:
    branches:
      - bt_conformance
    paths:
      - "tools/apply_bt_smp_tx_barrier.py"
      - ".github/workflows/apply-bt-final-review-fixes.yml"

permissions:
  contents: write

jobs:
  apply-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bt-failure-fix-run
          fetch-depth: 0

      - name: Apply SMP barrier
        run: python3 tools/apply_bt_smp_tx_barrier.py

      - name: Check patch
        run: git diff --check

      - name: GCC O0
        run: |
          make -C tests/bluetooth/host clean test CC=gcc CXX=g++ OPT=-O0
          make -C tests/bluetooth/compliance clean strict CC=gcc CXX=g++ OPT=-O0

      - name: GCC O2
        run: |
          make -C tests/bluetooth/host clean test CC=gcc CXX=g++ OPT=-O2
          make -C tests/bluetooth/compliance clean strict CC=gcc CXX=g++ OPT=-O2

      - name: Clang O0
        run: |
          make -C tests/bluetooth/host clean test CC=clang CXX=clang++ OPT=-O0
          make -C tests/bluetooth/compliance clean strict CC=clang CXX=clang++ OPT=-O0

      - name: Clang O2
        run: |
          make -C tests/bluetooth/host clean test CC=clang CXX=clang++ OPT=-O2
          make -C tests/bluetooth/compliance clean strict CC=clang CXX=clang++ OPT=-O2

      - name: Commit SMP barrier
        run: |
          rm -f tools/apply_bt_smp_tx_barrier.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/bluetooth/bt_smp.cpp tests/bluetooth/compliance/smp/bt_smp_dual_host_test.cpp tools/apply_bt_smp_tx_barrier.py
          git commit -m "bt: block early SMP responses behind unsent PDUs"
          git fetch origin bt-failure-fix-run
          git rebase origin/bt-failure-fix-run
          git push origin HEAD:bt-failure-fix-run
