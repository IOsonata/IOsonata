name: Apply Bluetooth final review fixes

on:
  push:
    branches:
      - bt-failure-fix-run
    paths:
      - "tools/apply_bt_final_review_fixes.py"
      - ".github/workflows/apply-bt-final-review-fixes.yml"

permissions:
  contents: write

jobs:
  apply-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bt-failure-fix-run
          fetch-depth: 0

      - name: Apply fixes
        run: python3 tools/apply_bt_final_review_fixes.py

      - name: Check patch
        run: git diff --check

      - name: GCC O0
        run: |
          make -C tests/bluetooth/host clean test CC=gcc CXX=g++ OPT=-O0
          make -C tests/bluetooth/compliance clean strict CC=gcc CXX=g++ OPT=-O0

      - name: GCC O2
        run: |
          make -C tests/bluetooth/host clean test CC=gcc CXX=g++ OPT=-O2
          make -C tests/bluetooth/compliance clean strict CC=gcc CXX=g++ OPT=-O2

      - name: Clang O0
        run: |
          make -C tests/bluetooth/host clean test CC=clang CXX=clang++ OPT=-O0
          make -C tests/bluetooth/compliance clean strict CC=clang CXX=clang++ OPT=-O0

      - name: Clang O2
        run: |
          make -C tests/bluetooth/host clean test CC=clang CXX=clang++ OPT=-O2
          make -C tests/bluetooth/compliance clean strict CC=clang CXX=clang++ OPT=-O2

      - name: Commit fixes
        run: |
          rm -f tools/apply_bt_final_review_fixes.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "bt: fix Execute Write callback compaction"
          git push origin HEAD:bt-failure-fix-run
