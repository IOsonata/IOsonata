name: USB Host Tests

on:
  push:
    paths:
      - 'include/usb/**'
      - 'include/bluetooth/bt_hci_usb.h'
      - 'src/usb/**'
      - 'src/bluetooth/bt_hci_usb.cpp'
      - 'ARM/Nordic/include/usb_ctrlr.h'
      - 'ARM/Nordic/src/usb_ctrlr_nrfx.cpp'
      - 'tests/usb/**'
      - 'exemples/usb/usb_iso_loopback.cpp'
      - '.github/workflows/usb-host-tests.yml'
  pull_request:
    paths:
      - 'include/usb/**'
      - 'include/bluetooth/bt_hci_usb.h'
      - 'src/usb/**'
      - 'src/bluetooth/bt_hci_usb.cpp'
      - 'ARM/Nordic/include/usb_ctrlr.h'
      - 'ARM/Nordic/src/usb_ctrlr_nrfx.cpp'
      - 'tests/usb/**'
      - 'exemples/usb/usb_iso_loopback.cpp'
      - '.github/workflows/usb-host-tests.yml'
  workflow_dispatch:

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libusb development package
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev pkg-config
      - name: GCC and Clang host matrix
        run: make -C tests/usb test-matrix
      - name: Compile asynchronous libusb ISO hardware runner
        run: make -C tests/usb iso-hw-build
