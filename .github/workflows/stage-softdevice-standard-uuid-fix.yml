name: Stage SoftDevice standard UUID type fix

on:
  push:
    branches:
      - fix/bm-standard-uuid-type

permissions:
  contents: write

jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bm-standard-uuid-type
          fetch-depth: 1

      - name: Apply standard UUID type fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          paths = (
              Path('ARM/Nordic/nRF54/src/bt_gatt_bm.cpp'),
              Path('ARM/Nordic/nRF52/src/bt_gatt_nrf52.cpp'),
          )

          for path in paths:
              text = path.read_text()
              marker = 'ble_uuid.type = pSrvc->Uuid.BaseIdx'
              pos = text.rfind(marker)
              if pos < 0:
                  raise SystemExit(f'service UUID assignment not found in {path}')

              line_start = text.rfind('\n', 0, pos) + 1
              indent = text[line_start:pos]
              if text[line_start:pos].strip():
                  raise SystemExit(f'unexpected service UUID line formatting in {path}')

              insert = (
                  f'{indent}// IOsonata standard service declarations are zero-initialized. '
                  'SoftDevice UUID type 0 is invalid; adopted 16-bit UUIDs use the '
                  'Bluetooth SIG base type.\n'
                  f'{indent}if (pSrvc->bCustom == false)\n'
                  f'{indent}' + '{\n'
                  f'{indent}\tpSrvc->Uuid.BaseIdx = BLE_UUID_TYPE_BLE;\n'
                  f'{indent}' + '}\n\n'
              )
              text = text[:line_start] + insert + text[line_start:]
              path.write_text(text)

          for path in paths:
              text = path.read_text()
              expected = 'pSrvc->Uuid.BaseIdx = BLE_UUID_TYPE_BLE;'
              if text.count(expected) != 1:
                  raise SystemExit(f'expected one standard UUID assignment in {path}')
          PY

          git diff --check
          make -C tests/bluetooth/host clean test CC=gcc CXX=g++ OPT=-O0
          make -C tests/bluetooth/compliance clean test CC=gcc CXX=g++ OPT=-O0

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ARM/Nordic/nRF54/src/bt_gatt_bm.cpp \
            ARM/Nordic/nRF52/src/bt_gatt_nrf52.cpp
          git commit -m "bt: use SoftDevice BLE type for standard UUIDs"
          git push origin HEAD:fix/bm-standard-uuid-type
