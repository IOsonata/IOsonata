name: Apply Bluetooth failure-path fixes

on:
  push:
    branches:
      - bt_conformance
    paths:
      - "tools/apply_bt_failure_fixes.py"
      - ".github/workflows/apply-bt-failure-fixes.yml"
  pull_request:
    branches:
      - bt_conformance
    paths:
      - "tools/apply_bt_failure_fixes.py"
      - ".github/workflows/apply-bt-failure-fixes.yml"

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.event.pull_request.head.ref || 'bt_conformance' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Apply fixes
        run: python3 tools/apply_bt_failure_fixes.py

      - name: Check patch
        run: git diff --check

      - name: GCC O0
        run: |
          make -C tests/bluetooth/host clean test CC=gcc CXX=g++ OPT=-O0
          make -C tests/bluetooth/compliance clean strict CC=gcc CXX=g++ OPT=-O0

      - name: GCC O2
        run: |
          make -C tests/bluetooth/host clean test CC=gcc CXX=g++ OPT=-O2
          make -C tests/bluetooth/compliance clean strict CC=gcc CXX=g++ OPT=-O2

      - name: Clang O0
        run: |
          make -C tests/bluetooth/host clean test CC=clang CXX=clang++ OPT=-O0
          make -C tests/bluetooth/compliance clean strict CC=clang CXX=clang++ OPT=-O0

      - name: Clang O2
        run: |
          make -C tests/bluetooth/host clean test CC=clang CXX=clang++ OPT=-O2
          make -C tests/bluetooth/compliance clean strict CC=clang CXX=clang++ OPT=-O2

      - name: Commit fixes
        run: |
          rm -f tools/apply_bt_failure_fixes.py
          rm -f .github/workflows/apply-bt-failure-fixes.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "bt: harden failure paths and adversarial tests"
          git push origin HEAD:${TARGET_BRANCH}

# PR trigger for the one-shot validation branch.
