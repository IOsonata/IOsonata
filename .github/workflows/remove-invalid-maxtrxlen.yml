name: Remove invalid DeviceIntrf transfer limit

on:
  pull_request:
    branches:
      - nvmio_design2
    paths:
      - .github/workflows/remove-invalid-maxtrxlen.yml
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nvmio_design2_review_fixes
          fetch-depth: 0

      - name: Remove invalid API and restore affected implementations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          workflow = root / '.github/workflows/remove-invalid-maxtrxlen.yml'
          tokens = ('MaxTrxLen', 'GetMaxTransferLen', 'DeviceIntrfGetMaxTransferLen')

          header = root / 'include/device_intrf.h'
          text = header.read_text()

          text, member_count = re.subn(
              r'^\s*size_t\s+MaxTrxLen\s*;[^\n]*\n',
              '', text, flags=re.MULTILINE)
          text, c_getter_count = re.subn(
              r'\nstatic inline size_t DeviceIntrfGetMaxTransferLen\([^\n]*\)\s*\{.*?\n\}\n',
              '\n', text, flags=re.DOTALL)
          text, cpp_getter_count = re.subn(
              r'^\s*size_t\s+GetMaxTransferLen\([^\n]*\)[^\n]*\n',
              '', text, flags=re.MULTILINE)

          if (member_count, c_getter_count, cpp_getter_count) != (1, 1, 1):
              raise SystemExit(
                  'unexpected DeviceIntrf API counts: '
                  f'member={member_count}, C getter={c_getter_count}, '
                  f'C++ getter={cpp_getter_count}')

          if 'size_t' not in text:
              text, include_count = re.subn(
                  r'^#include <stddef\.h>\n', '', text,
                  count=1, flags=re.MULTILINE)
              if include_count != 1:
                  raise SystemExit('expected stddef include was not found')

          header.write_text(text)

          # Remove every initializer, use and documentation line added around this API.
          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts or path in (header, workflow):
                  continue
              try:
                  text = path.read_text()
              except UnicodeDecodeError:
                  continue
              if not any(token in text for token in tokens):
                  continue
              lines = text.splitlines(keepends=True)
              filtered = [
                  line for line in lines
                  if not any(token in line for token in tokens)
              ]
              path.write_text(''.join(filtered))

          spi = root / 'ARM/Nordic/src/spi_nrfx.cpp'
          text = spi.read_text()

          rx_function = '''int nRFxSPIRxDataDma(DevIntrf_t * const pDev, uint8_t *pBuff, int BuffLen)
          {
          \tnRFSpiDev_t *dev = (nRFSpiDev_t *)pDev-> pDevData;
          \tint cnt = 0;
          
          #ifdef SPIM_PRESENT
          \tdev->pDmaReg->TXD.PTR = 0;
          \tdev->pDmaReg->TXD.MAXCNT = 0;
          \tdev->pDmaReg->TXD.LIST = 0;
          #ifdef NRF52_SERIES
          \t// Anomaly 109
          \tif (BuffLen < 2)
          \t{
          \t\tdev->pDmaReg->RXD.MAXCNT = 0;
          \t\tdev->pDmaReg->RXD.PTR = 0;
          \t\tdev->pDmaReg->RXD.LIST = 0;
          \t\tdev->pDmaReg->EVENTS_STARTED = 0;
          \t\tdev->pDmaReg->TASKS_START = 1;
          \t\twhile (dev->pDmaReg->EVENTS_STARTED == 0);
          \t\tdev->pDmaReg->EVENTS_STARTED = 0;
          \t}
          #endif
          
          \tdev->pDmaReg->RXD.PTR = (uint32_t)pBuff;
          \tdev->pDmaReg->RXD.LIST = SPIM_RXD_LIST_LIST_ArrayList << SPIM_RXD_LIST_LIST_Pos;
          
          \twhile (BuffLen > 0)
          \t{
          \t\tint l = min(BuffLen, NRFX_SPI_DMA_MAXCNT);
          
          \t\tdev->pDmaReg->RXD.MAXCNT = l;
          \t\tdev->pDmaReg->EVENTS_END = 0;
          \t\tdev->pDmaReg->EVENTS_ENDRX = 0;
          \t\tdev->pDmaReg->TASKS_START = 1;
          
          \t\tif (nRFxSPIWaitRX(dev, NRFSPI_TIMEOUT) == false)
          \t\t\tbreak;
          
          \t\tl = dev->pDmaReg->RXD.AMOUNT;
          \t\tBuffLen -= l;
          \t\tpBuff += l;
          \t\tcnt += l;
          \t}
          #endif
          
          \treturn cnt;
          }'''

          tx_function = '''int nRFxSPITxDataDma(DevIntrf_t * const pDev, const uint8_t *pData, int DataLen)
          {
          \tnRFSpiDev_t *dev = (nRFSpiDev_t *)pDev-> pDevData;
          \tint cnt = 0;
          
          #ifdef SPIM_PRESENT
          \tdev->pDmaReg->RXD.PTR = 0;
          \tdev->pDmaReg->RXD.MAXCNT = 0;
          \tdev->pDmaReg->RXD.LIST = 0;
          
          #ifdef NRF52_SERIES
          \t// Anomaly 109
          \tif (DataLen < 2)
          \t{
          \t\tdev->pDmaReg->TXD.MAXCNT = 0;
          \t\tdev->pDmaReg->TXD.PTR = 0;
          \t\tdev->pDmaReg->TXD.LIST = 0;
          \t\tdev->pDmaReg->EVENTS_STARTED = 0;
          \t\tdev->pDmaReg->TASKS_START = 1;
          \t\twhile (dev->pDmaReg->EVENTS_STARTED == 0);
          \t\tdev->pDmaReg->EVENTS_STARTED = 0;
          \t}
          #endif
          \tdev->pDmaReg->TXD.PTR = (uint32_t)pData;
          \tdev->pDmaReg->TXD.LIST = SPIM_TXD_LIST_LIST_ArrayList << SPIM_TXD_LIST_LIST_Pos;
          
          \twhile (DataLen > 0)
          \t{
          \t\tint l = min(DataLen, NRFX_SPI_DMA_MAXCNT);
          \t\tdev->pDmaReg->TXD.MAXCNT = l;
          \t\tdev->pDmaReg->EVENTS_END = 0;
          \t\tdev->pDmaReg->EVENTS_ENDTX = 0;
          \t\tdev->pDmaReg->TASKS_START = 1;
          
          \t\tif (nRFxSPIWaitDMA(dev, NRFSPI_TIMEOUT) == false)
          \t\t{
          \t\t\tbreak;
          \t\t}
          
          \t\tl = dev->pDmaReg->TXD.AMOUNT;
          \t\tDataLen -= l;
          \t\tpData += l;
          \t\tcnt += l;
          \t}
          #endif
          
          \treturn cnt;
          }'''

          text, rx_count = re.subn(
              r'int nRFxSPIRxDataDma\(DevIntrf_t \* const pDev, uint8_t \*pBuff, int BuffLen\)\n\{.*?\n\}\n\n// Stop receive',
              rx_function + '\n\n// Stop receive', text, count=1, flags=re.DOTALL)
          text, tx_count = re.subn(
              r'int nRFxSPITxDataDma\(DevIntrf_t \* const pDev, const uint8_t \*pData, int DataLen\)\n\{.*?\n\}\n\n// Stop transmit',
              tx_function + '\n\n// Stop transmit', text, count=1, flags=re.DOTALL)

          if (rx_count, tx_count) != (1, 1):
              raise SystemExit(
                  f'unexpected Nordic SPI function counts: rx={rx_count}, tx={tx_count}')

          spi.write_text(text)
          workflow.unlink()

          remaining = []
          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              try:
                  text = path.read_text()
              except UnicodeDecodeError:
                  continue
              for token in tokens:
                  if token in text:
                      remaining.append(f'{path}: {token}')
          if remaining:
              raise SystemExit('remaining invalid API references:\n' + '\n'.join(remaining))
          PY

          git diff --check
          git grep -nE 'MaxTrxLen|GetMaxTransferLen|DeviceIntrfGetMaxTransferLen' -- . ':!.git' && exit 1 || true
          git diff --name-only

      - name: Commit corrected implementation
        shell: bash
        run: |
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add -A
          git commit -m "Remove invalid DeviceIntrf transfer limit"
          git push origin HEAD:nvmio_design2_review_fixes
