name: Bluetooth host tests

on:
  push:
    branches:
      - master
      - bt_update
      - bt_conformance
    paths:
      - "include/bluetooth/**"
      - "src/bluetooth/**"
      - "tests/bluetooth/**"
      - "include/crypto/**"
      - "src/crypto/**"
      - "include/cfifo.h"
      - "src/cfifo.c"
      - "include/device.h"
      - "include/device_intrf.h"
      - "src/device.cpp"
      - "src/device_intrf.cpp"
      - "ARM/Nordic/src/bt_*.cpp"
      - "ARM/Nordic/**/src/bt_*.cpp"
      - "ARM/Nordic/**/include/**"
      - "ARM/ST/STM32WBAxx/src/bt_*.cpp"
      - "ARM/ST/STM32WBAxx/include/**"
      - ".github/workflows/bluetooth-host-tests.yml"
  pull_request:
    paths:
      - "include/bluetooth/**"
      - "src/bluetooth/**"
      - "tests/bluetooth/**"
      - "include/crypto/**"
      - "src/crypto/**"
      - "include/cfifo.h"
      - "src/cfifo.c"
      - "include/device.h"
      - "include/device_intrf.h"
      - "src/device.cpp"
      - "src/device_intrf.cpp"
      - "ARM/Nordic/src/bt_*.cpp"
      - "ARM/Nordic/**/src/bt_*.cpp"
      - "ARM/Nordic/**/include/**"
      - "ARM/ST/STM32WBAxx/src/bt_*.cpp"
      - "ARM/ST/STM32WBAxx/include/**"
      - ".github/workflows/bluetooth-host-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - cc: gcc
            cxx: g++
            opt: -O0
          - cc: gcc
            cxx: g++
            opt: -O2
          - cc: clang
            cxx: clang++
            opt: -O0
          - cc: clang
            cxx: clang++
            opt: -O2

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and run Bluetooth host tests
        run: |
          make -C tests/bluetooth/host clean test \
            CC=${{ matrix.cc }} \
            CXX=${{ matrix.cxx }} \
            OPT=${{ matrix.opt }}

      - name: Build and run strict Bluetooth compliance tests
        run: |
          make -C tests/bluetooth/compliance clean strict \
            CC=${{ matrix.cc }} \
            CXX=${{ matrix.cxx }} \
            OPT=${{ matrix.opt }}
