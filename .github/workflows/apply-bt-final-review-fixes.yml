name: Inspect SMP failure test

on:
  push:
    branches:
      - bt-failure-fix-run
    paths:
      - ".github/workflows/apply-bt-final-review-fixes.yml"
  pull_request:
    branches:
      - bt_conformance
    paths:
      - ".github/workflows/apply-bt-final-review-fixes.yml"

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bt-failure-fix-run
      - name: Show SMP wire helpers and blocked-TX test
        run: |
          grep -n -B25 -A80 "case WIRE_CMD_RX_SMP" tests/bluetooth/compliance/smp/bt_smp_dual_host_test.cpp
          grep -n -B20 -A80 "static bool SendInit" tests/bluetooth/compliance/smp/bt_smp_dual_host_test.cpp
          grep -n -B20 -A100 "TestTxFailureQueuesAndRetries" tests/bluetooth/compliance/smp/bt_smp_dual_host_test.cpp
