name: Bluetooth conformance autofix

on:
  push:
    branches:
      - bt_conformance
    paths:
      - ".github/workflows/bluetooth-host-tests.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: bt_conformance

      - name: Apply reviewed fixes
        run: python3 tools/bt_conformance_autofix.py

      - name: Check patch formatting
        run: git diff --check

      - name: Build and run host tests
        run: make -C tests/bluetooth/host clean test CC=gcc CXX=g++ OPT=-O0

      - name: Build and run compliance tests
        run: make -C tests/bluetooth/compliance clean test CC=gcc CXX=g++ OPT=-O0

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add include/bluetooth src/bluetooth ARM/Nordic/nRF52/src/bt_gatt_nrf52.cpp ARM/Nordic/nRF54/src/bt_gatt_bm.cpp
          git commit -m "Fix Bluetooth conformance review findings"
          git push origin HEAD:bt_conformance
