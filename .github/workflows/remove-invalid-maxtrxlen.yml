name: Remove invalid DeviceIntrf transfer limit

on:
  pull_request:
    branches:
      - nvmio_design2
    paths:
      - .github/workflows/remove-invalid-maxtrxlen.yml
      - .github/remove_invalid_maxtrxlen.py
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nvmio_design2_review_fixes
          fetch-depth: 0

      - name: Apply removal
        run: python3 .github/remove_invalid_maxtrxlen.py

      - name: Verify removal
        shell: bash
        run: |
          git diff --check
          if git grep -InE 'MaxTrxLen|GetMaxTransferLen|DeviceIntrfGetMaxTransferLen' -- . ':!.git'; then
            exit 1
          fi
          git diff --name-only

      - name: Commit corrected implementation
        shell: bash
        run: |
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add -A
          git commit -m "Remove invalid DeviceIntrf transfer limit"
          git push origin HEAD:nvmio_design2_review_fixes
