name: Bluetooth host tests

on:
  push:
    branches:
      - bt_update
      - bt_conformance
    paths:
      - "include/bluetooth/**"
      - "src/bluetooth/**"
      - "tests/bluetooth/**"
      - ".github/workflows/bluetooth-host-tests.yml"
  pull_request:
    paths:
      - "include/bluetooth/**"
      - "src/bluetooth/**"
      - "tests/bluetooth/**"
      - ".github/workflows/bluetooth-host-tests.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  host-unit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Commit dual-host SMP fix
        if: github.event_name == 'pull_request' && github.head_ref == 'tmp/bt-dual-host-compliance'
        run: |
          git apply --check tests/bluetooth/compliance/smp/bt_smp_dual_host_fix.patch
          git apply tests/bluetooth/compliance/smp/bt_smp_dual_host_fix.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bluetooth/bt_smp.cpp tests/bluetooth/compliance/smp/bt_smp_dual_host_test.cpp
          git commit -m "bt: complete Secure Connections OOB handling"
          git push origin HEAD:tmp/bt-dual-host-compliance

      - name: Build and run Bluetooth host tests
        run: |
          make -C tests/bluetooth/host clean test \
            CC=gcc \
            CXX=g++ \
            OPT=-O0

      - name: Build and run Bluetooth compliance tests
        run: |
          make -C tests/bluetooth/compliance clean test \
            CC=gcc \
            CXX=g++ \
            OPT=-O0
