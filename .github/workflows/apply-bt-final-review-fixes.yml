name: Inspect SMP failure test

on:
  push:
    branches:
      - bt-failure-fix-run
    paths:
      - ".github/workflows/apply-bt-final-review-fixes.yml"

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bt-failure-fix-run
      - name: Show SMP blocked-TX test and main registration
        run: |
          grep -n -B20 -A100 "TestTxFailureQueuesAndRetries" tests/bluetooth/compliance/smp/bt_smp_dual_host_test.cpp
          grep -n -B10 -A40 "int main" tests/bluetooth/compliance/smp/bt_smp_dual_host_test.cpp
