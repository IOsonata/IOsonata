name: Run USB RX architecture transform

on:
  push:
    paths:
      - 'tests/usb/apply_rx_arch.py'
      - 'tests/usb/apply_rx_arch_fix.py'
      - '.github/workflows/usb-rx-arch-apply2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: usb_rx_arch_test
          fetch-depth: 0
      - name: Apply source transform
        run: |
          python3 tests/usb/apply_rx_arch.py
          python3 tests/usb/apply_rx_arch_fix.py
      - name: Focused host validation
        run: |
          make -C tests/usb test-matrix
          g++ -Iinclude -Itests/usb/hostport -std=gnu++17 -Wall -Wextra -fsyntax-only \
            src/usb/usbd_cdc.cpp src/usb/usbd_bulk.cpp src/usb/usb_iso.cpp \
            src/bluetooth/bt_hci_usb.cpp
      - name: Commit source changes
        run: |
          git config user.name hnhoan
          git config user.email hnhoan@i-syst.com
          git add ARM/Nordic/include/usb_ctrlr.h ARM/Nordic/src/usb_ctrlr_nrfx.cpp \
            tests/usb/hostport/usb_ctrlr.h src/usb/usbd_cdc.cpp src/usb/usbd_bulk.cpp \
            src/usb/usb_iso.cpp src/bluetooth/bt_hci_usb.cpp
          git commit -m 'Restore event-driven USB endpoint DMA flow'
          git push origin HEAD:usb_rx_arch_test
