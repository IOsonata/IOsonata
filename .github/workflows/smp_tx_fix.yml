name: Temporary SMP TX validation

on:
  push:
    branches:
      - bt_sig_compliance_smp_tx_fix
  pull_request:
    branches:
      - bt_sig_compliance

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: bt_sig_compliance_smp_tx_fix

      - name: Apply exact source patch
        run: |
          python3 .tmp_smp_tx_patch.py
          rm -f .tmp_trigger .tmp_trigger2 .tmp_trigger3
          python3 - <<'PY'
          from pathlib import Path
          for name in (
              "src/bluetooth/bt_hci_host.cpp",
              "tests/bluetooth/host/Makefile",
              "tests/bluetooth/host/bt_hci_smp_tx_test.cpp",
          ):
              path = Path(name)
              lines = path.read_text().splitlines()
              path.write_text("\n".join(line.rstrip() for line in lines) + "\n")
          PY

      - name: Check patch formatting
        shell: bash
        run: |
          set -o pipefail
          git diff --check 2>&1 | tee diff-check.log
          test ! -s diff-check.log

      - name: Run GCC host test matrix
        shell: bash
        run: set -o pipefail; make -C tests/bluetooth/host test-gcc 2>&1 | tee gcc-host.log

      - name: Run Clang host test matrix
        shell: bash
        run: set -o pipefail; make -C tests/bluetooth/host test-clang 2>&1 | tee clang-host.log

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smp-tx-validation-logs
          path: |
            diff-check.log
            gcc-host.log
            clang-host.log
          if-no-files-found: ignore

      - name: Commit validated result
        run: |
          rm -f diff-check.log gcc-host.log clang-host.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Account native SMP packets in ACL completion order"
          git push origin HEAD:bt_sig_compliance_smp_tx_fix
