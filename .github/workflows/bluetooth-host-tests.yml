name: Bluetooth host tests

on:
  push:
    branches:
      - bt_update
      - bt_conformance
    paths:
      - "include/bluetooth/**"
      - "src/bluetooth/**"
      - "tests/bluetooth/**"
      - ".github/workflows/bluetooth-host-tests.yml"
  pull_request:
    paths:
      - "include/bluetooth/**"
      - "src/bluetooth/**"
      - "tests/bluetooth/**"
      - ".github/workflows/bluetooth-host-tests.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  host-unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - cc: gcc
            cxx: g++
            opt: -O0
          - cc: gcc
            cxx: g++
            opt: -O2
          - cc: clang
            cxx: clang++
            opt: -O0
          - cc: clang
            cxx: clang++
            opt: -O2

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Commit staged SMP declaration fix
        if: github.event_name == 'pull_request' && github.head_ref == 'tmp/bt-dual-host-compliance' && matrix.cc == 'gcc' && matrix.opt == '-O0'
        run: |
          if git apply --check tests/bluetooth/compliance/smp/bt_smp_forward_decl.patch; then
            git apply tests/bluetooth/compliance/smp/bt_smp_forward_decl.patch
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/bluetooth/bt_smp.cpp
            git commit -m "bt: declare SMP public-key send helper"
            git push origin HEAD:tmp/bt-dual-host-compliance
          fi

      - name: Build and run Bluetooth host tests
        run: |
          make -C tests/bluetooth/host clean test \
            CC=${{ matrix.cc }} \
            CXX=${{ matrix.cxx }} \
            OPT=${{ matrix.opt }}

      - name: Build and run Bluetooth compliance tests
        run: |
          make -C tests/bluetooth/compliance clean test \
            CC=${{ matrix.cc }} \
            CXX=${{ matrix.cxx }} \
            OPT=${{ matrix.opt }}
