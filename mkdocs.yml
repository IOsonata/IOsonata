site_name: "IOSonata Documentation"

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Quick reference: quick-reference.md
  - Supported targets: supported-targets.md
  - Release notes:
      - "0.13": releases/0.13.md
  - User guides:
      - Bluetooth: bluetooth-user-guide.md
      - USB: usb-user-guide.md
      - USB on nRF54LM20: usb-nrf54lm20x.md
      - NVM: nvm-user-guide.md
      - SD cards: sdcard-user-guide.md
      - SDRAM: sdram-user-guide.md
      - Networking: networking.md
      - MQTT and CoAP: network-protocol-examples.md
      - Audio DK: nrf5340-audio-dk.md
      - nPM1300: npm1300.md
      - SSD1315: display/ssd1315.md
      - Touch: display/touch.md
      - Buzzer: buzzer.md
      - Software SPI: spi_soft.md
  - Architecture:
      - Overview: architecture/README.md
      - Bluetooth: architecture/bluetooth.md
      - USB: architecture/usb.md
      - Device composition: architecture/device-composition.md
      - Device interface notes: architecture/devintrf-implementer-notes.md
      - DFU: architecture/dfu.md
      - DFU wire format: architecture/dfu_wire.md
      - NVM: architecture/nvm.md
      - IOcomposer workflow: architecture/iocomposer-workflow.md
  - Reference:
      - Classes: class.md
      - Functions: functions.md
      - Dependencies: dependencies.md
      - FAQ: FAQ.md

theme:
  name: material

plugins:
  - search
  - mkdoxy:
      projects:
        Device:
          src-dirs: include/device.h include/device_intrf.h
          full-doc: True
          doxy-cfg:
            FILE_PATTERNS: "*.h"
            RECURSIVE: True
            HIDE_UNDOC_CLASSES: YES
            HIDE_UNDOC_MEMBERS: YES
            HIDE_UNDOC_RELATIONS: YES