name: Installer offline regressions

on:
  push:
    branches:
      - release_0_13_final_prep
    paths:
      - 'Installer/**'
      - 'tests/installer/**'
      - '.github/workflows/installer-regressions.yml'
  pull_request:
    paths:
      - 'Installer/**'
      - 'tests/installer/**'
      - '.github/workflows/installer-regressions.yml'
  workflow_dispatch:

jobs:
  installer-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Check installer shell syntax
        shell: bash
        run: |
          set -euo pipefail
          for script in Installer/*_linux.sh; do bash -n "$script"; done
          for script in Installer/*_macos.sh; do zsh -n "$script"; done
      - name: Run offline installer tests
        run: python3 -m unittest discover -s tests/installer -p 'test_*.py' -v
