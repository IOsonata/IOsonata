name: Linker script reference audit

on:
  push:
    branches:
      - fix_ldscript_naming_013
    paths:
      - 'ARM/**'
      - 'RISC-V/**'
      - 'tests/ldscript_reference_audit.py'
      - 'tests/test_ldscript_reference_audit.py'
      - '.github/workflows/ldscript-audit.yml'
  workflow_dispatch:

jobs:
  linker-references:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit regression tests
        run: python3 -m unittest discover -s tests -p 'test_ldscript_reference_audit.py' -v
      - name: Check all Eclipse and IAR linker references
        run: python3 tests/ldscript_reference_audit.py
